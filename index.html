<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gym Tracker V3</title>
<link rel="stylesheet" href="css/app.css"></head><body>
<div class="app"><div class="top">
<div class="row"><div><h1>Gym Tracker V3</h1><div class="meta">Cycle A1 → A2 → B1 → B2</div></div><button class="btn" id="theme">🌙</button></div>
<div class="actions"><button class="btn start" id="start">▶ Démarrer</button><button class="btn finish" id="finish">■ Fin de séance</button></div>
<div class="status" id="status">Séance non démarrée. Elle commencera aussi à la première répétition.</div>
<div class="stats"><div class="stat"><b id="done">0/5</b><span class="meta">exercices</span></div><div class="stat"><b id="volume">0</b><span class="meta">volume kg</span></div><div class="stat"><b id="duration">00:00</b><span class="meta">durée</span></div></div>
<div class="tabs" id="tabs"></div></div>
<div id="list"></div><section class="history"><h2>Dernières séances</h2><div id="history"></div></section></div>
<div class="bottom"><div class="timerwrap"><div><div class="meta">Repos</div><div class="timer" id="timer">Prêt</div></div><div class="timerbuttons"><button data-s="60">60 s</button><button data-s="90">90 s</button><button data-s="120">120 s</button></div></div></div>
<script src="js/app.js"></script>
</body></html>
