name: Signaler un bug
description: Signaler un comportement incorrect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que s'est-il passé ?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Appareil et navigateur
      placeholder: iPhone, version iOS, Safari
